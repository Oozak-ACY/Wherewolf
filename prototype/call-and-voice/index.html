<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE Wherewolf call + voice</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 8px; background: #111; color: #eee; }
    .proto { background: #a30; color: #fff; padding: 4px 8px; margin: 0 0 8px; }
    .join { display: flex; flex-direction: column; gap: 10px; }
    input, select, button { font-size: 16px; }
    .big { padding: 14px; font-size: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    button { padding: 8px 10px; }
    .grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
    .tile { position: relative; aspect-ratio: 3/4; background: #000; border-radius: 6px; overflow: hidden; }
    .tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile span { position: absolute; left: 4px; bottom: 4px; background: #0008; padding: 2px 4px; }
    .black { display: grid; place-items: center; height: 100%; color: #666; }
    .asleep { position: absolute; inset: 0; z-index: 2; background: #000; display: grid; place-items: center; font-size: 22px; }
    .state, .log { background: #222; padding: 6px; font-size: 11px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="audio-sink" hidden></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
