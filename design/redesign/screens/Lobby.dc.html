<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Wherewolf — Salon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2A1F}a:hover{color:#5E1A12}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE4CB; font-family: 'EB Garamond', Georgia, serif; color: #2B1D12; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 18px 20px 14px; background: #1F3F6E; border-bottom: 3px solid #B88A2E; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.24em; color: #E8D9B4">CODE DU SALON</span>
      <span style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 34px; letter-spacing: 0.22em; color: #FBF4E2">K7QX</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" aria-label="Afficher le QR code" style="width: 48px; height: 48px; border-radius: 6px; border: 2px solid #D9B45A; background: transparent; color: #FBF4E2; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v7M14 20h3"></path></svg>
      </button>
      <button type="button" aria-label="Partager le lien" style="width: 48px; height: 48px; border-radius: 6px; border: 2px solid #D9B45A; background: transparent; color: #FBF4E2; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.06em">Joueurs (6 / 12)</h2>
      <span style="font-size: 15px; font-style: italic; color: #5A4632">5 au minimum</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{players}}" as="p" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #FBF4E2; border: 1px solid #C9AE7C; border-radius: 6px; min-height: 44px; box-sizing: border-box">
          <div style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #8A2A1F; border: 2px solid #D9B45A; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">{{p.initial}}</div>
          <div style="display: flex; flex-direction: column; min-width: 0">
            <span style="font-size: 17px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
            <span style="font-size: 13px; font-style: italic; color: #5A4632; line-height: 1.1">{{p.tag}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; color: #8A6A2A">
      <div style="flex: 1; height: 1px; background: #B88A2E"></div>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#B88A2E"></path></svg>
      <div style="flex: 1; height: 1px; background: #B88A2E"></div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.06em">Rôles</h2>
      <span style="font-size: 15px; font-weight: 600; color: #2F5A3A">6 rôles pour 6 joueurs</span>
    </div>

    <div style="display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
        <div style="flex: none; width: 96px; display: flex; flex-direction: column; gap: 6px; align-items: center">
          <div style="position: relative; width: 96px; height: 150px">
            <img src="{{r.img}}" alt="{{r.name}}" style="width: 96px; height: 150px; object-fit: cover; border-radius: 6px; opacity: {{r.opacity}}; box-shadow: 0 4px 10px rgba(43,29,18,0.3)">
            <div style="position: absolute; top: -6px; right: -6px; min-width: 28px; height: 28px; border-radius: 14px; background: #2B1D12; border: 2px solid #D9B45A; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">{{r.count}}</div>
          </div>
          <span style="font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; text-align: center">{{r.name}}</span>
          <div style="display: flex; gap: 6px">
            <button type="button" aria-label="Un {{r.name}} de moins" style="width: 44px; height: 36px; border-radius: 6px; border: 2px solid #2B1D12; background: #FBF4E2; font-size: 20px; color: #2B1D12; cursor: pointer">−</button>
            <button type="button" aria-label="Un {{r.name}} de plus" style="width: 44px; height: 36px; border-radius: 6px; border: 2px solid #2B1D12; background: #FBF4E2; font-size: 20px; color: #2B1D12; cursor: pointer">+</button>
          </div>
        </div>
      </sc-for>
    </div>

    <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border-radius: 6px; border: 1px solid #C9AE7C; background: transparent; font-family: 'Cinzel', serif; font-size: 14px; color: #2B1D12; cursor: pointer">
      <span>Minuteries et rôles cachés</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <div style="padding: 12px 20px 20px; border-top: 2px solid #B88A2E; background: #E6D7B5">
    <button type="button" style="width: 100%; height: 56px; border-radius: 6px; border: 2px solid #2B1D12; box-shadow: inset 0 0 0 2px #D9B45A; background: {{accent}}; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; letter-spacing: 0.1em; cursor: pointer">Lancer la partie</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A2A1F","options":["#8A2A1F","#1F3F6E","#2F5A3A","#5B2A6E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const players = [
      { name: 'Camille', tag: 'Hôte · toi' },
      { name: 'Hugo', tag: 'prêt' },
      { name: 'Léa', tag: 'prêt' },
      { name: 'Mathis', tag: 'déconnecté' },
      { name: 'Inès', tag: 'prêt' },
      { name: 'Théo', tag: 'prêt' }
    ].map((p) => ({ ...p, initial: p.name[0] }));
    const roles = [
      { name: 'Loup-Garou', img: '../roles/werewolf.webp', count: 2 },
      { name: 'Voyante', img: '../roles/seer.webp', count: 1 },
      { name: 'Sorcière', img: '../roles/witch.webp', count: 1 },
      { name: 'Villageois', img: '../roles/villager.webp', count: 2 },
      { name: 'Chasseur', img: '../roles/hunter.webp', count: 0 },
      { name: 'Cupidon', img: '../roles/cupid.webp', count: 0 },
      { name: 'Voleur', img: '../roles/thief.webp', count: 0 }
    ].map((r) => ({ ...r, opacity: r.count ? 1 : 0.45 }));
    return { accent: this.props.accent ?? '#8A2A1F', players, roles };
  }
}
</script>
</body>
</html>
