<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Wherewolf — Ton rôle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D9B45A}a:hover{color:#F0D58A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1210; font-family: 'EB Garamond', Georgia, serif; color: #F3E8CF; display: flex; flex-direction: column; align-items: center; padding: 22px 20px 20px; gap: 14px; overflow: hidden">

  <span style="font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.32em; color: #CDB98F">TU ES</span>

  <img src="{{role.img}}" alt="Carte du {{role.name}}" style="width: 236px; height: 422px; object-fit: cover; border-radius: 10px; box-shadow: 0 0 0 2px #B88A2E, 0 18px 40px rgba(0,0,0,0.6)">

  <h1 style="margin: 0; font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 46px; line-height: 1; color: #F0D58A">{{role.name}}</h1>

  <div style="display: flex; gap: 8px; align-items: center">
    <span style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.18em; color: #CDB98F">CAMP</span>
    <span style="padding: 4px 12px; border-radius: 999px; background: #8A2A1F; border: 1px solid #D9B45A; font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px; color: #FBF4E2">{{role.camp}}</span>
  </div>

  <p style="margin: 0; text-align: center; font-size: 18px; line-height: 1.35; color: #E8DCC0; max-width: 330px">{{role.power}}</p>

  <div style="width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #5A4632; border-radius: 6px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.18em; color: #CDB98F">LES AUTRES LOUPS-GAROUS</span>
    <span style="font-size: 18px; font-weight: 600">Hugo</span>
  </div>

  <button type="button" style="margin-top: auto; width: 100%; height: 56px; border-radius: 6px; border: 2px solid #D9B45A; box-shadow: inset 0 0 0 2px #2B1D12; background: #8A2A1F; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px; letter-spacing: 0.08em; cursor: pointer">J'ai vu mon rôle</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","default":"werewolf","options":["werewolf","seer","witch","hunter","cupid","thief","villager"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const roles = {
      werewolf: { name: 'Loup-Garou', camp: 'Loups-Garous', img: '../roles/werewolf.webp', power: 'Chaque nuit, avec les autres Loups-Garous, tu choisis une victime à dévorer.' },
      seer: { name: 'Voyante', camp: 'Village', img: '../roles/seer.webp', power: 'Chaque nuit, tu découvres le rôle d’un joueur de ton choix.' },
      witch: { name: 'Sorcière', camp: 'Village', img: '../roles/witch.webp', power: 'Une potion de guérison pour sauver la victime des Loups, une potion de poison pour tuer.' },
      hunter: { name: 'Chasseur', camp: 'Village', img: '../roles/hunter.webp', power: 'Quand tu meurs, tu abats aussitôt un joueur de ton choix.' },
      cupid: { name: 'Cupidon', camp: 'Village', img: '../roles/cupid.webp', power: 'La première nuit, tu désignes deux Amoureux, toi compris si tu veux.' },
      thief: { name: 'Voleur', camp: 'Village', img: '../roles/thief.webp', power: 'La deuxième nuit, tu peux voler le rôle d’un joueur.' },
      villager: { name: 'Villageois', camp: 'Village', img: '../roles/villager.webp', power: 'Aucun pouvoir : seulement ton flair et ta voix pour démasquer les Loups.' }
    };
    return { role: roles[this.props.role ?? 'werewolf'] ?? roles.werewolf };
  }
}
</script>
</body>
</html>
