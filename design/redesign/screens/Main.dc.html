<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Wherewolf — Accueil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=UnifrakturMaguntia&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A2A1F}a:hover{color:#5E1A12}
input::placeholder{color:#7A6650}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px; background: #EFE4CB; font-family: 'EB Garamond', Georgia, serif; color: #2B1D12; position: relative; overflow: hidden">
  <div style="height: 100%; box-sizing: border-box; border: 2px solid #B88A2E; outline: 1px solid #2B1D12; outline-offset: 4px; padding: 28px 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.32em; color: #5A4632; text-transform: uppercase">Les Loups-Garous</div>
      <h1 style="margin: 0; font-family: 'UnifrakturMaguntia', serif; font-weight: 400; font-size: 64px; line-height: 1; color: {{accent}}">Wherewolf</h1>
    </div>

    <div style="position: relative; width: 300px; height: 270px; flex: none">
      <img src="../roles/seer.webp" alt="Carte de la Voyante" style="position: absolute; left: 6px; top: 34px; width: 120px; height: 215px; object-fit: cover; border-radius: 8px; transform: rotate(-11deg); box-shadow: 0 8px 18px rgba(43,29,18,0.35)">
      <img src="../roles/villager.webp" alt="Carte du Villageois" style="position: absolute; right: 6px; top: 34px; width: 120px; height: 215px; object-fit: cover; border-radius: 8px; transform: rotate(11deg); box-shadow: 0 8px 18px rgba(43,29,18,0.35)">
      <img src="../roles/werewolf.webp" alt="Carte du Loup-Garou" style="position: absolute; left: 80px; top: 0px; width: 140px; height: 251px; object-fit: cover; border-radius: 9px; box-shadow: 0 12px 26px rgba(43,29,18,0.45)">
    </div>

    <p style="margin: 0; text-align: center; font-size: 19px; font-style: italic; line-height: 1.35; color: #4A3826; max-width: 290px">Une table, des amis, un téléphone chacun. Le Narrateur mène la partie.</p>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: auto">
      <button type="button" style="height: 56px; border-radius: 6px; border: 2px solid #2B1D12; box-shadow: inset 0 0 0 2px #D9B45A; background: {{accent}}; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 17px; letter-spacing: 0.08em; cursor: pointer">Créer un salon</button>

      <div style="display: flex; align-items: center; gap: 10px; color: #5A4632; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em">
        <div style="flex: 1; height: 1px; background: #B88A2E"></div>
        <span>OU</span>
        <div style="flex: 1; height: 1px; background: #B88A2E"></div>
      </div>

      <label for="code" style="font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.1em; color: #4A3826">Rejoindre avec un code</label>
      <div style="display: flex; gap: 10px">
        <input id="code" type="text" placeholder="Code du salon" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 6px; border: 2px solid #2B1D12; background: #FBF4E2; font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.18em; color: #2B1D12">
        <button type="button" style="height: 52px; padding: 0 18px; border-radius: 6px; border: 2px solid #2B1D12; background: #1F3F6E; box-shadow: inset 0 0 0 2px #D9B45A; color: #FBF4E2; font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; cursor: pointer">Y aller</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A2A1F","options":["#8A2A1F","#1F3F6E","#2F5A3A","#5B2A6E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8A2A1F' };
  }
}
</script>
</body>
</html>
