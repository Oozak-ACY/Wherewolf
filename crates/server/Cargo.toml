[package]
name = "wherewolf-server"
version = "0.1.0"
edition = "2021"
description = "Game server: HTTP + WebSocket relay between the phones and the Narrator engine."

[dependencies]
wherewolf-engine = { path = "../engine" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs.workspace = true
